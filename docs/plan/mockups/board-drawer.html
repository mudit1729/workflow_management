<title>wf Board &amp; Drawer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Layout: a framed desktop canvas [NavRail | Board] with the issue drawer overlaying the board. */
  :root {
    --bg:#fff; --subtle:#f7f7f8; --muted:#efeff1; --border:#e5e5e8; --border-strong:#d3d3d8;
    --text:#18181b; --text-muted:#5f5f6b; --text-faint:#8e8e99;
    --accent:#5e6ad2; --accent-subtle:#eef0fb; --accent-fg:#fff;
    --s-backlog:#a1a1aa; --s-planned:#71717a; --s-in_progress:#3b82f6; --s-blocked:#e5484d; --s-review:#8e4ec6; --s-done:#30a46c;
    --stale:#d99a06; --danger:#e5484d;
    --h1:#2a78d6; --h2:#eb6834; --h3:#1baf7a; --h4:#eda100; --h5:#e87ba4; --h6:#008300; --h7:#6250d6; --h8:#e34948;
    --pop: 0 4px 16px rgb(0 0 0/.08), 0 0 0 1px var(--border);
    --toast-bg:#18181b; --toast-fg:#fafafa;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0f0f11; --subtle:#151517; --muted:#1c1c1f; --border:#26262a; --border-strong:#34343a;
      --text:#ededef; --text-muted:#a1a1aa; --text-faint:#6e6e78;
      --accent:#7c85e0; --accent-subtle:#1e2040;
      --s-backlog:#b6b6bd; --s-planned:#85858e; --s-in_progress:#629bf8; --s-blocked:#ea6c70; --s-review:#a26dd0; --s-done:#39c481;
      --stale:#f5b730; --danger:#ff6369;
      --h1:#3987e5; --h2:#d95926; --h3:#199e70; --h4:#c98500; --h5:#d55181; --h6:#008300; --h7:#9085e9; --h8:#e66767;
      --pop: 0 4px 16px rgb(0 0 0/.4), 0 0 0 1px var(--border-strong);
      --toast-bg:#ededef; --toast-fg:#18181b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0f0f11; --subtle:#151517; --muted:#1c1c1f; --border:#26262a; --border-strong:#34343a;
    --text:#ededef; --text-muted:#a1a1aa; --text-faint:#6e6e78;
    --accent:#7c85e0; --accent-subtle:#1e2040;
    --s-backlog:#b6b6bd; --s-planned:#85858e; --s-in_progress:#629bf8; --s-blocked:#ea6c70; --s-review:#a26dd0; --s-done:#39c481;
    --stale:#f5b730; --danger:#ff6369;
    --h1:#3987e5; --h2:#d95926; --h3:#199e70; --h4:#c98500; --h5:#d55181; --h6:#008300; --h7:#9085e9; --h8:#e66767;
    --pop: 0 4px 16px rgb(0 0 0/.4), 0 0 0 1px var(--border-strong);
    --toast-bg:#ededef; --toast-fg:#18181b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; border-color: var(--border); }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { font: 13px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; font-feature-settings: "cv11","ss01"; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
  .page { height: 100%; display: flex; flex-direction: column; gap: 10px; padding-block: 14px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .cap { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; font-size: 12px; color: var(--text-faint); }
  .cap b { color: var(--text); font-weight: 600; font-size: 13px; }
  .frame { flex: 1; min-height: 0; overflow: auto; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--bg); }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .faint { color: var(--text-faint); } .muted { color: var(--text-muted); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  :focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px; border-radius: 4px; }
  .app { display: grid; grid-template-columns: 232px 1fr; height: 100%; min-width: 1240px; min-height: 640px; }

  /* NavRail */
  nav { background: var(--subtle); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 10px 8px; gap: 2px; min-height: 0; }
  .ws { display: flex; align-items: center; gap: 8px; padding: 4px 6px 10px; }
  .mark { width: 20px; height: 20px; border-radius: 6px; background: var(--text); color: var(--bg); font-size: 10px; font-weight: 600; display: grid; place-items: center; }
  .ws b { font-weight: 600; flex: 1; }
  .search { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text-faint); margin-bottom: 8px; width: 100%; text-align: left; }
  .search kbd { margin-left: auto; }
  kbd { font: 10px ui-monospace, Menlo, monospace; border: 1px solid var(--border); background: var(--subtle); border-radius: 4px; padding: 0 4px; height: 16px; display: inline-grid; place-items: center; color: var(--text-muted); }
  .item { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border-radius: 6px; color: var(--text-muted); width: 100%; text-align: left; }
  .item:hover { background: var(--muted); color: var(--text); }
  .item.on { background: var(--muted); color: var(--text); font-weight: 500; }
  .item .n { margin-left: auto; font-size: 11px; font-variant-numeric: tabular-nums; }
  .badge { background: var(--accent); color: var(--accent-fg); border-radius: 9px; padding: 0 6px; font-size: 11px; font-weight: 500; line-height: 16px; }
  .label { font-size: 11px; font-weight: 500; color: var(--text-faint); padding: 14px 8px 4px; }
  .tree .item { height: 26px; font-weight: 400; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
  .chev { width: 10px; color: var(--text-faint); font-size: 9px; }
  .mini { width: 28px; height: 3px; border-radius: 2px; overflow: hidden; display: flex; gap: 1px; margin-left: 6px; flex: none; }
  .mini i { display: block; height: 100%; }
  .needs { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .navfoot { margin-top: auto; display: flex; align-items: center; gap: 6px; padding: 8px 6px 2px; border-top: 1px solid var(--border); color: var(--text-faint); font-size: 12px; }
  .seg { display: inline-flex; background: var(--muted); padding: 2px; border-radius: 6px; gap: 2px; }
  .seg button { padding: 2px 8px; border-radius: 4px; font-size: 12px; color: var(--text-muted); }
  .seg button.on { background: var(--bg); color: var(--text); box-shadow: 0 0 0 1px var(--border), 0 1px 1px rgb(0 0 0/.04); }
  .seg button .n { color: var(--text-faint); margin-left: 4px; font-variant-numeric: tabular-nums; }
  .proto { margin-left: auto; font-size: 11px; border: 1px dashed var(--border-strong); border-radius: 10px; padding: 1px 8px; }

  /* Main + board */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; overflow: hidden; }
  .toolbar { height: 44px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; flex: none; }
  .crumb { display: flex; align-items: center; gap: 6px; font-weight: 500; }
  .crumb .sep { color: var(--text-faint); font-weight: 400; }
  .sum { color: var(--text-faint); font-size: 12px; margin-left: 6px; }
  .sum b { color: var(--accent); font-weight: 500; }
  .tools { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .btn { height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 12px; }
  .btn:hover { background: var(--subtle); color: var(--text); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 500; }
  .btn.primary:hover { filter: brightness(1.08); }
  .board { flex: 1; min-height: 0; background: var(--subtle); display: flex; gap: 8px; padding: 12px; overflow-x: auto; }
  .rail { width: 36px; flex: none; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 0; }
  .rail:hover { border-color: var(--border-strong); }
  .rail .v { writing-mode: vertical-rl; font-size: 12px; font-weight: 500; color: var(--text-muted); }
  .col { width: 264px; flex: none; display: flex; flex-direction: column; min-height: 0; }
  .colhead { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 4px; font-weight: 500; }
  .colhead .n { color: var(--text-faint); font-weight: 400; font-variant-numeric: tabular-nums; }
  .colhead .fold { margin-left: auto; width: 22px; height: 22px; border-radius: 4px; color: var(--text-faint); display: grid; place-items: center; }
  .colhead .fold:hover { background: var(--muted); color: var(--text); }
  .cards { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; min-height: 0; padding-bottom: 8px; }
  .empty { border: 1px dashed var(--border-strong); border-radius: 6px; padding: 14px; text-align: center; color: var(--text-faint); font-size: 12px; }
  .card { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%; transition: border-color 100ms; }
  .card:hover { border-color: var(--border-strong); }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: color-mix(in srgb, var(--accent-subtle) 55%, var(--bg)); }
  .card .foot { display: none; font-size: 11px; color: var(--text-faint); gap: 6px; align-items: center; border-top: 1px solid var(--border); padding-top: 6px; }
  .card:hover .foot, .card:focus-visible .foot { display: flex; }
  .r1 { display: flex; gap: 8px; align-items: flex-start; }
  .title { font-weight: 500; flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .r2 { display: flex; font-size: 11px; color: var(--text-faint); gap: 8px; }
  .r2 .id { margin-left: auto; }
  .chips { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .chip { height: 20px; padding: 0 6px; border-radius: 4px; font-size: 11px; display: inline-flex; align-items: center; gap: 4px; font-weight: 500; white-space: nowrap; }
  .c-acc { background: var(--accent-subtle); color: var(--accent); }
  .c-dan { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
  .c-stale { background: color-mix(in srgb, var(--stale) 14%, transparent); color: color-mix(in srgb, var(--stale) 80%, var(--text)); }
  .c-ok { background: color-mix(in srgb, var(--s-done) 14%, transparent); color: color-mix(in srgb, var(--s-done) 85%, var(--text)); }
  .c-neu { background: var(--muted); color: var(--text-muted); }
  .c-out { border: 1px solid var(--border); color: var(--text-muted); font-weight: 400; }
  .stack { margin-left: auto; display: flex; }
  .av { width: 16px; height: 16px; border-radius: 4px; display: inline-grid; place-items: center; color: #fff; font-size: 8px; font-weight: 600; box-shadow: 0 0 0 1.5px var(--bg); flex: none; }
  .av.h { border-radius: 50%; }
  .av.sm { width: 14px; height: 14px; font-size: 7px; }
  .stack .av + .av { margin-left: -4px; }
  .lint { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .prio { flex: none; margin-top: 3px; }

  /* Drawer */
  .scrim { position: absolute; inset: 44px 0 0 0; }
  .drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 560px; background: var(--bg); box-shadow: var(--pop); display: flex; flex-direction: column; min-height: 0; transition: transform 200ms cubic-bezier(.2,0,0,1); }
  .drawer[hidden], .scrim[hidden] { display: none !important; }
  .dh { padding: 12px 16px 0; display: flex; flex-direction: column; gap: 8px; }
  .dh1 { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-faint); }
  .dh1 .ib { margin-left: auto; display: flex; gap: 2px; }
  .ib button { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--text-muted); }
  .ib button:hover { background: var(--muted); color: var(--text); }
  h1 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.25; text-wrap: balance; }
  .props { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .pill { height: 24px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
  .pill b { color: var(--text); font-weight: 500; }
  .pill.warn { color: color-mix(in srgb, var(--stale) 80%, var(--text)); border-color: color-mix(in srgb, var(--stale) 40%, var(--border)); }
  .tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--border); padding: 0 16px; margin-top: 4px; }
  .tab { height: 36px; display: flex; align-items: center; gap: 6px; color: var(--text-muted); position: relative; }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--text); font-weight: 500; }
  .tab.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--text); border-radius: 1px; }
  .tab .n { font-size: 11px; color: var(--text-faint); font-weight: 400; font-variant-numeric: tabular-nums; }
  .tab .n.acc { color: var(--accent); font-weight: 500; }
  .body { flex: 1; min-height: 0; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px; }
  .hero { font-size: 14px; font-weight: 500; line-height: 1.4; }
  .meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-faint); margin-top: 6px; flex-wrap: wrap; }
  .sec { font-size: 11px; font-weight: 500; color: var(--text-faint); margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
  .sec .r { margin-left: auto; font-weight: 400; }
  .ask { border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); background: color-mix(in srgb, var(--accent-subtle) 60%, var(--bg)); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .ask.done { border-color: var(--border); background: var(--subtle); }
  .q { display: flex; gap: 8px; font-weight: 500; }
  .qmeta, .acts, .answer { padding-left: 22px; }
  .qmeta { font-size: 12px; color: var(--text-faint); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .ref { color: var(--text-muted); text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 2px; }
  .acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .acts .note { font-size: 12px; color: var(--text-faint); margin-left: 4px; }
  .acts .note:hover { color: var(--text); }
  textarea { font: inherit; width: 100%; min-height: 56px; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; background: var(--bg); color: var(--text); resize: vertical; }
  .answer { font-size: 12px; color: var(--text-muted); display: flex; flex-direction: column; gap: 2px; }
  .task { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 6px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; max-width: 100%; background: var(--bg); white-space: nowrap; transition: opacity 120ms, border-color 120ms; }
  .task .tid { color: var(--text-muted); font-size: 11px; }
  .task .tt { overflow: hidden; text-overflow: ellipsis; }
  .task.ready { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
  .task.rel { border-color: var(--accent); }
  .task.dim { opacity: .35; }
  .rdot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
  .prose { color: var(--text-muted); }
  .prose p { margin: 0 0 8px; }
  ol.next { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
  ol.next li { display: flex; gap: 8px; align-items: baseline; color: var(--text-muted); }
  ol.next li .k { width: 34px; text-align: right; color: var(--text-faint); font-variant-numeric: tabular-nums; flex: none; }
  ol.next li.first { color: var(--text); font-weight: 500; }
  code { font: 12px ui-monospace, Menlo, monospace; background: var(--muted); padding: 0 4px; border-radius: 4px; font-weight: 400; }
  details.coll { border-top: 1px solid var(--border); }
  details.coll:last-of-type { border-bottom: 1px solid var(--border); }
  details.coll summary { height: 32px; display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 12px; cursor: pointer; list-style: none; }
  details.coll summary::-webkit-details-marker { display: none; }
  details.coll summary::before { content: "▸"; font-size: 9px; color: var(--text-faint); width: 10px; }
  details.coll[open] summary::before { content: "▾"; }
  details.coll summary .n { color: var(--text-faint); }
  details.coll .in { padding: 0 0 10px 18px; color: var(--text-muted); font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
  .sig { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--danger); }

  /* Goal */
  .crit { display: flex; flex-direction: column; }
  .crow { display: grid; grid-template-columns: 16px 36px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); align-items: start; }
  .crow:last-child { border-bottom: 0; }
  .cb { width: 14px; height: 14px; border-radius: 3px; border: 1.5px solid var(--border-strong); margin-top: 2px; display: grid; place-items: center; }
  .cb.claimed { border-color: var(--s-done); background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--s-done) 50%, transparent) 0 1.5px, transparent 1.5px 3.5px); }
  .cb.verified { border-color: var(--s-done); background: var(--s-done); cursor: default; }
  .sc { font-size: 11px; color: var(--text-faint); margin-top: 1px; }
  .ears { color: var(--text); }
  .kw { font-variant-caps: all-small-caps; letter-spacing: .04em; color: var(--text-faint); }
  .cchips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .ring-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-muted); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; }

  /* Plan */
  .lanes { position: relative; display: grid; grid-template-columns: 70px repeat(3, minmax(150px, 1fr)); gap: 8px 10px; align-items: start; overflow-x: auto; padding-bottom: 4px; }
  .lanes .lh { font-size: 11px; color: var(--text-faint); }
  .lanes .ln { font-size: 12px; font-weight: 500; color: var(--text-muted); padding-top: 3px; }
  .lanes .cell { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .lanes svg { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .phases { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--text-faint); }
  .tdetail { border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--subtle); }
  .kv { display: grid; grid-template-columns: 84px 1fr; gap: 4px 10px; font-size: 12px; }
  .kv dt { color: var(--text-faint); }
  .kv dd { margin: 0; color: var(--text-muted); min-width: 0; overflow-wrap: anywhere; }
  .step { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--text-muted); cursor: pointer; }

  /* Log */
  .daylabel { position: sticky; top: -16px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(4px); font-size: 12px; font-weight: 500; color: var(--text-muted); padding: 6px 0; z-index: 1; }
  .tl { position: relative; display: flex; flex-direction: column; gap: 12px; padding-left: 20px; }
  .tl::before { content: ""; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 1px; background: var(--border); }
  .ent { position: relative; display: flex; flex-direction: column; gap: 3px; }
  .ent .mk { position: absolute; left: -20px; top: 5px; width: 9px; height: 9px; border-radius: 2px; box-shadow: 0 0 0 2px var(--bg); }
  .ent .mk.h { border-radius: 50%; }
  .ent .mk.fail { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--danger); }
  .ent .t1 { display: flex; gap: 6px; align-items: baseline; }
  .ent .t1 b { font-weight: 500; flex: 1; }
  .ent .t1 .when { font-size: 11px; color: var(--text-faint); }
  .ent .t2 { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--text-faint); }
  .ent .bd { color: var(--text-muted); font-size: 12px; }
  .ent.failure .t1 b { color: var(--danger); }
  .dcard { border: 1px solid var(--border); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .dcard h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .dcard .dec { border-left: 2px solid var(--accent); padding-left: 10px; color: var(--text); }
  .dcard .lab { font-size: 11px; color: var(--text-faint); font-weight: 500; }
  .dcard .old { opacity: .6; }
  .dcard .old h4 { margin: 0; font-size: 12px; font-weight: 500; text-decoration: line-through; }
  .lcard { border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: grid; grid-template-columns: 24px 1fr; gap: 10px; }

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');

  const AUTH = {
    shruti: { hue: 1, human: true, ini: 'SJ' }, 'claude-opus': { hue: 7 }, codex: { hue: 2 },
    'claude-sonnet': { hue: 3 }, 'cursor-bot': { hue: 4 }, mudit: { hue: 5, human: true, ini: 'MJ' },
  };
  const av = (h, sm) => { const a = AUTH[h] || { hue: 8 }; return `<span class="av ${a.human ? 'h' : ''} ${sm ? 'sm' : ''}" style="background:var(--h${a.hue})" title="@${h}">${a.human ? a.ini : `<svg width="${sm ? 10 : 12}" height="${sm ? 10 : 12}"><use href="#bot"/></svg>`}</span>`; };
  const st = (s, z = 14) => `<svg width="${z}" height="${z}" aria-label="${s}"><use href="#st-${s}"/></svg>`;
  const LABEL = { backlog: 'Backlog', planned: 'Planned', in_progress: 'In progress', blocked: 'Blocked', review: 'Review', done: 'Done' };
  const ring = (v, c, t, z = 14) => {
    const r = z === 14 ? 5.5 : 11, sw = z === 14 ? 2 : 3, C = 2 * Math.PI * r, cx = z / 2;
    if (!t) return `<svg width="${z}" height="${z}"><circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--border-strong)" stroke-width="${sw}" stroke-dasharray="2 2"/></svg>`;
    const a = C * v / t, b = C * c / t;
    return `<svg width="${z}" height="${z}" role="img" aria-label="${v} verified, ${c} claimed of ${t}"><circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--border-strong)" stroke-width="${sw}"/>` +
      (a ? `<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--s-done)" stroke-width="${sw}" stroke-dasharray="${a} ${C}" transform="rotate(-90 ${cx} ${cx})"/>` : '') +
      (b ? `<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="url(#hatch)" stroke-width="${sw}" stroke-dasharray="0 ${a} ${b} ${C}" transform="rotate(-90 ${cx} ${cx})"/>` : '') + `</svg>`;
  };

  // ---------------------------------------------------------------- data
  const ISSUES = [
    { id: 'wf-k2r9d', title: 'Keyboard map for the board', status: 'backlog', group: 'web', crit: [0, 0, 3] },
    { id: 'wf-z5p1h', title: 'Compact density toggle', status: 'backlog', group: 'web', crit: [0, 0, 2] },
    { id: 'wf-m2x7c', title: 'Command palette', status: 'planned', group: 'web', crit: [0, 0, 4], tasks: '0/3 tasks · 1 ready', who: 'claude-sonnet', when: '3h' },
    { id: 'wf-3k9x2', title: 'Live board updates', status: 'in_progress', group: 'web', prio: 'high', crit: [2, 1, 5], needs: 1, leases: ['claude-opus', 'codex'], tasks: '1/5 tasks · 1 ready', who: 'codex', when: '6m', rich: true },
    { id: 'wf-f4d3b', title: 'Fade changed cards and show a reconnecting badge', status: 'in_progress', group: 'web', crit: [0, 0, 2], stale: 'Stale 2d', leases: ['claude-sonnet'], tasks: '0/2 tasks', who: 'claude-sonnet', when: '2d' },
    { id: 'wf-a4c8z', title: 'Stream archify renders in the background', status: 'in_progress', group: 'web', crit: [2, 0, 5], expired: true, lint: 'warn', leases: ['cursor-bot'], tasks: '2/4 tasks', who: 'cursor-bot', when: '1h' },
    { id: 'wf-q8n5t', title: 'Inline answer box in the inbox', status: 'blocked', group: 'web', crit: [0, 0, 3], blocked: 'Blocked by wf-3k9x2', tasks: '0/2 tasks', who: 'shruti', when: '5h' },
    { id: 'wf-7yq2m', title: 'Fix tab-title count', status: 'review', group: 'web', crit: [1, 0, 1], lint: 'error', lintNote: 'F001', tasks: 'no plan (size xs)', who: 'codex', when: '40m' },
    { id: 'wf-d7c4w', title: 'Design tokens', status: 'done', group: 'web', crit: [4, 0, 4], tasks: '3/3 tasks', who: 'shruti', when: '1d' },
    { id: 'wf-t3n8v', title: 'Pre-paint theme script', status: 'done', group: 'web', crit: [2, 0, 2], tasks: 'no plan (size xs)', who: 'claude-sonnet', when: '1d' },
  ];
  const byId = Object.fromEntries(ISSUES.map(i => [i.id, i]));
  const GROUPS = [
    { id: 'all', title: 'All issues', n: 27, depth: 0 },
    { id: 'wf', title: 'wf', hue: 7, n: 19, depth: 0, chev: '▾', mix: [['backlog', 20], ['planned', 15], ['in_progress', 25], ['review', 10], ['done', 30]] },
    { id: 'core', title: 'core', hue: 2, n: 7, depth: 1, mix: [['planned', 30], ['in_progress', 40], ['done', 30]] },
    { id: 'web', title: 'web', hue: 1, n: 10, depth: 1, needs: true, mix: [['backlog', 20], ['planned', 10], ['in_progress', 30], ['blocked', 10], ['review', 10], ['done', 20]] },
    { id: 'skills', title: 'skills', hue: 3, n: 4, depth: 1, mix: [['planned', 50], ['done', 50]] },
    { id: 'platform', title: 'platform', hue: 4, n: 3, depth: 0, chev: '▸', mix: [['blocked', 33], ['planned', 67]] },
    { id: 'docs', title: 'docs', n: 5, depth: 0, implicit: true, mix: [['backlog', 60], ['done', 40]] },
  ];
  const S = { group: 'web', open: null, tab: 'now', log: 'changes', folded: { backlog: true, done: true }, answered: false, selTask: null,
    crit: { 'SC-1': 'verified', 'SC-2': 'verified', 'SC-3': 'claimed', 'SC-4': 'open', 'SC-5': 'open' }, steps: { 1: true, 2: false } };

  const CRIT = [
    { id: 'SC-1', parts: [['When', 1], [' an agent appends to `changes.md`, '], ['the', 1], [' board '], ['shall', 1], [' show the entry within 2 s.']], verify: '`cargo test -p wf-index live_append`', evidence: 'C-7k2q9 verify · pass', tasks: ['T-1', 'T-3', 'T-5'] },
    { id: 'SC-2', parts: [['If', 1], [' `goal.md` frontmatter is invalid, '], ['then the', 1], [' drawer '], ['shall', 1], [' show a lint finding and the raw file.']], verify: 'manual', evidence: '`evidence/sc2.png`, checked by @shruti', tasks: [] },
    { id: 'SC-3', parts: [['While', 1], [' the event stream is down, '], ['the', 1], [' board '], ['shall', 1], [' show a reconnecting badge and replay missed events on reconnect.']], verify: '`cargo test -p wf-server sse_replay`', tasks: ['T-3', 'T-5'] },
    { id: 'SC-4', parts: [['When', 1], [' two tabs are open, '], ['the', 1], [' dashboard '], ['shall', 1], [' hold only one event-stream connection.']], verify: 'manual', tasks: ['T-4'] },
    { id: 'SC-5', parts: [['The', 1], [' daemon '], ['shall', 1], [' ignore the watcher echo of its own writes.']], verify: '`cargo test -p wf-index echo_suppression`', tasks: ['T-2'] },
  ];
  const TASKS = [
    { id: 'T-1', title: 'Diff snapshots into deltas', status: 'done', lane: 'core', level: 0, deps: [], owns: 'crates/wf-index/src/delta.rs', sat: 'SC-1', who: 'codex' },
    { id: 'T-2', title: 'Suppress watcher echoes by content hash', status: 'review', lane: 'core', level: 0, deps: [], owns: 'crates/wf-index/src/watch.rs', sat: 'SC-5', who: 'codex' },
    { id: 'T-3', title: 'Build the SSE delta stream', status: 'in_progress', lane: 'server', level: 1, deps: ['T-1', 'T-2'], owns: 'crates/wf-server/src/sse.rs', sat: 'SC-1, SC-3', who: 'codex', lease: '34m left', verify: '`cargo test -p wf-server sse`',
      brief: 'Stream `delta` events from the index broadcast. Send `snapshot` on connect.', steps: ['Add the `GET /api/events` route.', 'Answer a lagged client with `resync`.'] },
    { id: 'T-4', title: 'Elect one leader tab over BroadcastChannel', status: 'todo', lane: 'web', level: 0, deps: [], owns: 'web/src/lib/live/leader.ts', sat: 'SC-4', ready: true },
    { id: 'T-5', title: 'Fade changed cards and show the reconnecting badge', status: 'todo', lane: 'web', level: 2, deps: ['T-3', 'T-4'], owns: 'web/src/features/board/**', sat: 'SC-1, SC-3' },
  ];
  const CHANGES = [
    { day: 'Today', t: '6m', who: 'codex', kind: '●', title: 'Added the `GET /api/events` route', meta: ['T-3', '9f1e2ab', 'sse.rs'], body: 'The route streams `delta` events from the index broadcast and sends `snapshot` on connect.' },
    { day: 'Today', t: '25m', who: 'claude-opus', kind: '✎', title: 'Rewrote current_state after the transport decision', meta: [], body: 'Summary now points at resync for lagged clients.' },
    { day: 'Today', t: '48m', who: 'codex', kind: '✕', title: 'notify 9.0-rc lost rename events on macOS', fail: true, meta: ['T-2', 'fail'], body: 'Saw `Remove(Any)` with no matching create after an atomic save. Reverted to notify 8.2.' },
    { day: 'Today', t: '1h', who: 'codex', kind: '✓', title: 'Verified SC-1 with the live-append test', ok: true, meta: ['SC-1', 'pass', 'C-7k2q9'], body: '`cargo test -p wf-index live_append` passed in 1.4 s.' },
    { day: 'Yesterday', t: '1d', who: 'shruti', kind: '↩', title: 'Answered: keep the drawer on the Now tab first', meta: ['Q-8d2kw'], body: 'Q: Should the drawer open on Now or Goal? A: Now. I read the state first.' },
    { day: 'Yesterday', t: '1d', who: 'claude-sonnet', kind: '⌕', title: 'Measured SSE connection limits across tabs', meta: ['research'], body: 'Chrome holds 6 HTTP/1.1 connections per origin. A seventh tab stalls.' },
    { day: 'Yesterday', t: '1d', who: 'codex', kind: '●', title: 'Diffed snapshots into deltas', meta: ['T-1', '4c0d9e1', 'delta.rs'], body: 'Deltas carry upserted and removed issues plus the ids whose details changed.' },
  ];

  // ---------------------------------------------------------------- board
  function renderTree() {
    $('#tree').innerHTML = GROUPS.map(g => `<button class="item ${S.group === g.id ? 'on' : ''}" role="treeitem" data-group="${g.id}" style="padding-left:${8 + g.depth * 16}px">
      <span class="chev">${g.chev || ''}</span>${g.hue ? `<span class="dot" style="background:var(--h${g.hue})"></span>` : g.id === 'all' ? '' : '<span class="dot" style="background:var(--text-faint)"></span>'}
      ${g.implicit ? `<i class="faint">${g.title}</i>` : g.title}${g.needs ? '<span class="needs" style="margin-left:6px" title="Needs you"></span>' : ''}
      <span class="n faint">${g.n}</span>${g.mix ? `<span class="mini">${g.mix.map(([s, w]) => `<i style="width:${w}%;background:var(--s-${s})"></i>`).join('')}</span>` : ''}</button>`).join('');
    const g = GROUPS.find(x => x.id === S.group);
    const path = g.id === 'all' ? [] : g.depth ? [GROUPS[1], g] : [g];
    $('#crumb').innerHTML = `<button class="faint" data-group="all" style="font-weight:400">All issues</button>` +
      path.map(p => `<span class="sep">/</span><button data-group="${p.id}" style="display:inline-flex;gap:6px;align-items:center">${p.hue ? `<span class="dot" style="background:var(--h${p.hue})"></span>` : ''}${p.title}</button>`).join('');
    const needs = S.answered ? 0 : 1;
    $('#sum').innerHTML = `${ISSUES.length} issues · ${needs ? `<b>${needs} needs you</b> · ` : ''}1 stale`;
  }

  function card(i) {
    const [v, c, t] = i.crit;
    const sel = S.open === i.id ? 'sel' : '';
    const needs = i.needs && !S.answered;
    const chips = [
      needs ? `<span class="chip c-acc"><svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 14.5A6.5 6.5 0 1 0 2.3 11L1.5 14.5 5 13.7A6.5 6.5 0 0 0 8 14.5z"/></svg>1 · blocking</span>` : '',
      i.blocked ? `<span class="chip c-dan">${i.blocked}</span>` : '',
      i.stale ? `<span class="chip c-stale">◷ ${i.stale}</span>` : '',
      i.expired ? `<span class="chip c-stale">Lease expired</span>` : '',
      i.lint ? `<span class="lint" style="background:var(--${i.lint === 'error' ? 'danger' : 'stale'})" title="${i.lint === 'error' ? '1 error: F001 invalid YAML' : '2 warnings'}"></span>${i.lintNote ? `<span class="faint" style="font-size:11px">${i.lintNote}</span>` : ''}` : '',
      i.leases ? `<span class="stack">${i.leases.map(h => av(h)).join('')}</span>` : '',
    ].join('');
    const prio = i.prio === 'high' ? `<svg class="prio" width="12" height="12" viewBox="0 0 12 12" aria-label="High priority"><rect x="1" y="7" width="2.2" height="4" rx=".6" fill="var(--text-muted)"/><rect x="4.9" y="4.5" width="2.2" height="6.5" rx=".6" fill="var(--text-muted)"/><rect x="8.8" y="2" width="2.2" height="9" rx=".6" fill="var(--text-muted)"/></svg>` : '';
    return `<button class="card ${sel}" data-wf="IssueCard" data-open="${i.id}">
      <div class="r1">${prio}<span class="title">${esc(i.title)}</span>${ring(v, c, t)}</div>
      <div class="r2"><span>${i.group}</span><span class="id mono">${i.id}</span></div>
      ${chips ? `<div class="chips">${chips}</div>` : ''}
      <div class="foot">${i.tasks || ''}<span style="margin-left:auto;display:inline-flex;gap:4px;align-items:center">${i.who ? av(i.who, true) : ''}${i.when || ''}</span></div>
    </button>`;
  }

  function renderBoard() {
    const cols = ['backlog', 'planned', 'in_progress', 'blocked', 'review', 'done'];
    $('#board').innerHTML = cols.map(s => {
      const items = ISSUES.filter(i => i.status === s);
      if (S.folded[s]) return `<button class="rail" data-unfold="${s}" title="${LABEL[s]}: click to unfold">${st(s)}<span class="faint" style="font-size:11px">${items.length}</span><span class="v">${LABEL[s]}</span></button>`;
      const fold = s === 'backlog' || s === 'done' ? `<button class="fold" data-fold="${s}" aria-label="Fold ${LABEL[s]}" title="Fold to a rail">⇤</button>` : '';
      return `<div class="col" data-wf="KanbanColumn"><div class="colhead">${st(s)}${LABEL[s]} <span class="n">${items.length}</span>${fold}</div>
        <div class="cards">${items.length ? items.map(card).join('') : '<div class="empty">No issues</div>'}</div></div>`;
    }).join('');
  }

  // ---------------------------------------------------------------- drawer
  function header(i) {
    const rich = i.rich;
    return `<div class="dh" data-wf="IssueHeader">
      <div class="dh1"><span class="dot" style="background:var(--h1);width:6px;height:6px"></span>wf / ${i.group} / <span class="mono">${i.id}</span>

  function drawEdges(hover) {
    const box = $('#lanes'), svg = $('#edges');
    if (!box || !svg) return;
    const focus = hover || S.selTask;
    const T = Object.fromEntries(TASKS.map(t => [t.id, t]));
    const related = new Set();
    if (focus) {
      related.add(focus);
      const up = id => T[id].deps.forEach(d => { related.add(d); up(d); });
      const down = id => TASKS.filter(t => t.deps.includes(id)).forEach(t => { related.add(t.id); down(t.id); });
      up(focus); down(focus);
    }
    box.querySelectorAll('.task').forEach(el => { el.classList.toggle('dim', !!focus && !related.has(el.dataset.task)); el.classList.toggle('rel', el.dataset.task === focus); });
    const b = box.getBoundingClientRect();
    const rect = id => box.querySelector(`.task[data-task="${id}"]`).getBoundingClientRect();
    let paths = '';
    if (focus) TASKS.forEach(t => t.deps.forEach(d => {
      if (!related.has(t.id) || !related.has(d)) return;
      const a = rect(d), z = rect(t.id);
      const x1 = a.right - b.left + box.scrollLeft, y1 = a.top + a.height / 2 - b.top, x2 = z.left - b.left + box.scrollLeft - 3, y2 = z.top + z.height / 2 - b.top;
      const mx = (x1 + x2) / 2;
      paths += `<path d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}" fill="none" stroke="var(--accent)" stroke-width="1.25"/><path d="M${x2} ${y2} l-5 -3 v6 z" fill="var(--accent)"/>`;
    }));
    svg.innerHTML = paths;
  }

    if (d.task) { S.selTask = S.selTask === d.task ? null : d.task; if (S.tab !== 'plan') S.tab = 'plan'; return renderDrawer(); }
    if (d.step) { S.steps[d.step] = !S.steps[d.step]; return renderDrawer(); }
    if (d.toast) { e.preventDefault(); return toast(d.toast); }
  });
  document.addEventListener('mouseover', e => { const p = e.target.closest('#lanes .task'); if (p) drawEdges(p.dataset.task); });
  document.addEventListener('mouseout', e => { const p = e.target.closest('#lanes .task'); if (p && !p.contains(e.relatedTarget)) drawEdges(); });
  document.addEventListener('keydown', e => {
    if (e.target.closest('textarea,input')) return;
    if (e.key === 'Escape' && S.open) { S.open = null; render(); }
    if (S.open && /^[1-5]$/.test(e.key)) { S.tab = ['now', 'goal', 'plan', 'log', 'files'][e.key - 1]; renderDrawer(); }
  });

  const root = document.documentElement;
  const btns = { auto: $('#ta'), light: $('#tl'), dark: $('#td') };
  for (const [k, b] of Object.entries(btns)) b.addEventListener('click', () => {
    if (k === 'auto') delete root.dataset.theme; else root.dataset.theme = k;
    for (const [k2, b2] of Object.entries(btns)) b2.classList.toggle('on', k2 === k);
  });

  S.open = 'wf-3k9x2';
  render();
})();
</script>
