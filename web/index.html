<!doctype html>
<html lang="en" data-theme="light" data-density="comfy">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>wf</title>
    <script>
      // Pre-paint: set data-theme and data-density before first paint (no flash).
      (function () {
        var t = "system", d = "comfy";
        try {
          var p = JSON.parse(localStorage.getItem("wf-prefs") || "{}");
          if (p && p.state) { t = p.state.theme || t; d = p.state.density || d; }
        } catch (e) {}
        if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.density = d;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
